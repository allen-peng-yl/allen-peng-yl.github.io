bios:
  - PhD student in Pharmaceutical Health Services Research at the University of Maryland, Baltimore, and health economist with 8 years of experience across a national health technology assessment (HTA) agency and global pharmaceutical companies (Pfizer, Novartis). Skilled in cost-effectiveness analysis (CEA), budget impact modeling, and real-world evidence generation using SAS, R, Excel, and TreeAge, with a strong track record of rigorous model development and critical appraisal supporting HTA submissions and payer decisions. Recognized with Pfizer’s 2023 Global Best Practice Award for accelerating reimbursement and pricing approvals.

